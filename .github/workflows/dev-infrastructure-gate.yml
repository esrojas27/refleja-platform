name: DEV infrastructure gate

on:
  pull_request:
    paths:
      - ".github/workflows/dev-infrastructure-gate.yml"
      - "infra/dev/bootstrap-state/**"
      - "infra/dev/platform/**"
      - "scripts/*backup*"
  push:
    branches: [master]
    paths:
      - ".github/workflows/dev-infrastructure-gate.yml"
      - "infra/dev/bootstrap-state/**"
      - "infra/dev/platform/**"
      - "scripts/*backup*"
  workflow_dispatch:

concurrency:
  group: dev-infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/dev/bootstrap-state
          - infra/dev/platform
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Verify formatting
        working-directory: ${{ matrix.root }}
        run: terraform fmt -check
      - name: Initialize providers without accessing remote state
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color
      - name: Check backup scripts
        if: matrix.root == 'infra/dev/platform'
        run: |
          bash -n scripts/dev-database-backup.sh
          bash -n scripts/install-dev-backup.sh
          docker run --rm -v "$PWD/scripts:/scripts:ro" koalaman/shellcheck:v0.10.0 \
            --severity=warning /scripts/dev-database-backup.sh /scripts/install-dev-backup.sh /scripts/test-dev-backup.sh
      - name: Restore synthetic backup and reject failed copies
        if: matrix.root == 'infra/dev/platform'
        run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/test-dev-backup.sh
