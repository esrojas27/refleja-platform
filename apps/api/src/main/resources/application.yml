spring:
  application:
    name: refleja-tu-interior-api
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/refleja_tu_interior}
    username: ${DB_USERNAME:rti_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL:jdbc:postgresql://localhost:5432/refleja_tu_interior}
    user: ${DB_MIGRATION_USERNAME:rti_migrator}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: rti
    schemas: rti
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rti

app:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI}
      jwk-set-uri: ${COGNITO_JWK_SET_URI}
      app-client-id: ${COGNITO_APP_CLIENT_ID}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
